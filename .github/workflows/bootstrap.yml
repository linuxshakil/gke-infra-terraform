name: Bootstrap Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:

  bootstrap:

    name: Bootstrap Google Cloud

    runs-on: ubuntu-latest

    environment: production

    defaults:
      run:
        working-directory: bootstrap

    steps:

      #########################################################
      # Checkout Repository
      #########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################
      # Authenticate to Google Cloud
      #########################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.BOOTSTRAP_WIF_PROVIDER }}
          service_account: ${{ secrets.BOOTSTRAP_SERVICE_ACCOUNT }}

      #########################################################
      # Install Google Cloud SDK
      #########################################################

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      #########################################################
      # Verify Authentication
      #########################################################

      - name: Verify Authentication
        run: |
          gcloud auth list
          gcloud config list
          gcloud projects describe ${{ secrets.GCP_PROJECT_ID }}

      #########################################################
      # Setup Terraform
      #########################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      #########################################################
      # Terraform Init
      #########################################################

      - name: Terraform Init
        run: terraform init

      #########################################################
      # Terraform Format
      #########################################################

      - name: Terraform Format
        run: terraform fmt -recursive -check

      #########################################################
      # Terraform Validate
      #########################################################

      - name: Terraform Validate
        run: terraform validate

      #########################################################
      # Terraform Plan
      #########################################################

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      #########################################################
      # Upload Plan
      #########################################################

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-plan
          path: bootstrap/tfplan
          retention-days: 7

      #########################################################
      # Terraform Apply
      #########################################################

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      #########################################################
      # Display Outputs
      #########################################################

      - name: Bootstrap Outputs
        run: terraform output
