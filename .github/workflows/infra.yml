name: Terraform Infrastructure

on:

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

  pull_request:
    branches:
      - main
    paths:
      - "infra/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:

  terraform:

    name: Terraform Infrastructure

    runs-on: ubuntu-latest

    timeout-minutes: 60

    environment: production

    defaults:
      run:
        working-directory: infra

    steps:

############################################################
# Checkout
############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

############################################################
# Authenticate to Google Cloud
############################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

############################################################
# Install Google Cloud SDK
############################################################

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

############################################################
# Verify Authentication
############################################################

      - name: Verify Google Authentication
        run: |

          echo "========== ACCOUNT =========="
          gcloud auth list

          echo ""
          echo "========== PROJECT =========="
          gcloud config get-value project

          echo ""
          echo "========== PROJECT DETAILS =========="
          gcloud projects describe ${{ secrets.GCP_PROJECT_ID }}

############################################################
# Setup Terraform
############################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

############################################################
# Versions
############################################################

      - name: Terraform Version
        run: terraform version

      - name: Google Cloud Version
        run: gcloud version

############################################################
# Terraform Init
############################################################

      - name: Terraform Init
        run: |
          terraform init \
            -input=false

############################################################
# Providers
############################################################

      - name: Terraform Providers
        run: terraform providers

############################################################
# Format Check
############################################################

      - name: Terraform Format
        run: terraform fmt -recursive -check

############################################################
# Validate
############################################################

      - name: Terraform Validate
        run: terraform validate

############################################################
# Terraform Plan
############################################################

      - name: Terraform Plan
        run: |
          terraform plan \
            -parallelism=20 \
            -input=false \
            -lock-timeout=10m \
            -no-color \
            -out=tfplan

############################################################
# Display Plan
############################################################

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

############################################################
# Upload Plan
############################################################

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          retention-days: 30

############################################################
# Terraform Apply
############################################################

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |

          terraform apply \
            -parallelism=20 \
            -input=false \
            -auto-approve \
            -no-color \
            tfplan | tee terraform-apply.log

############################################################
# Outputs
############################################################

      - name: Terraform Outputs
        if: github.ref == 'refs/heads/main'
        run: terraform output -no-color

############################################################
# Export Outputs
############################################################

      - name: Export Outputs
        if: github.ref == 'refs/heads/main'
        run: terraform output -json > terraform-output.json

############################################################
# Upload Outputs
############################################################

      - name: Upload Outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: infra/terraform-output.json

############################################################
# Upload Apply Log
############################################################

      - name: Upload Apply Log
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-log
          path: infra/terraform-apply.log

############################################################
# Deployment Summary
############################################################

      - name: Deployment Summary
        if: github.ref == 'refs/heads/main'
        run: |

          {
            echo "# Terraform Infrastructure Deployment"

            echo ""

            echo "## Project"

            echo "${{ secrets.GCP_PROJECT_ID }}"

            echo ""

            echo "## Region"

            echo "${{ secrets.GCP_REGION }}"

            echo ""

            echo "## Branch"

            echo "${{ github.ref_name }}"

            echo ""

            echo "## Commit"

            echo "${{ github.sha }}"

            echo ""

            echo "## Terraform Outputs"

            echo '```'

            terraform output -no-color

            echo '```'

          } >> $GITHUB_STEP_SUMMARY
