# Workflow name displayed in GitHub Actions
name: Deploy External Secrets

# Trigger workflow when changes are pushed to the main branch
on:
  push:
    branches:
      - main

    # Run workflow only when External Secrets code changes
    paths:
      - "apps/external-secrets/**"
      - ".github/workflows/external-secrets.yml"

# Required permissions for GitHub OIDC authentication
permissions:
  contents: read
  id-token: write

jobs:
  deploy:

    # Use GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    defaults:
      run:
        # Execute all commands from the External Secrets directory
        working-directory: apps/external-secrets

    steps:

      # Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      # Install Google Cloud SDK
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      # Download Terraform providers and initialize backend
      - name: Terraform Init
        run: terraform init

      # Verify Terraform code formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Apply Terraform changes
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
