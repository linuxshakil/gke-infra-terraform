apiVersion: batch/v1
kind: Job

metadata:
  name: wordpress-restore
  namespace: wordpress

spec:

  template:

    spec:

      restartPolicy: Never

      serviceAccountName: cloudsql-backup

      containers:

      - name: restore

        image: asia-south1-docker.pkg.dev/gke-prod-demo-001/backup-images/cloudsql-backup:v3

        imagePullPolicy: Always

        env:

        - name: MODE
          value: "restore"

        - name: GOOGLE_CLOUD_PROJECT
          value: "gke-prod-demo-001"

        volumeMounts:

        - name: wordpress-data
          mountPath: /var/www/html/wp-content/uploads

      volumes:

      - name: wordpress-data

        persistentVolumeClaim:

          claimName: wordpress-data
