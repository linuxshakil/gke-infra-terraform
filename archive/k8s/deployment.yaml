apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wordpress

  template:
    metadata:
      labels:
        app: wordpress

    spec:
      serviceAccountName: wordpress-sa

      containers:
      - name: wordpress

        image: wordpress:php8.3-apache

        ports:
        - containerPort: 80

        env:
        - name: WORDPRESS_DB_HOST
          value: "10.40.0.3"

        - name: WORDPRESS_DB_NAME
          value: "wordpress"

        - name: WORDPRESS_DB_USER
          value: "wordpress"

        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-db
              key: password

        volumeMounts:
        - name: wordpress-data
          mountPath: /var/www/html

      volumes:
      - name: wordpress-data
        persistentVolumeClaim:
          claimName: wordpress-data
